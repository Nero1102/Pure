[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pure"
version = "0.1.0"
description = "Agent runtime platform for long-lived technical tasks over code repositories"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13.0",
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
faiss = [
  "faiss-cpu>=1.8.0",
]

[project.scripts]
pure = "pure.cli.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["pure*"]
